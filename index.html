<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>李帅b的鞋子 · 3D 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #fff;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  #viewer { position: fixed; inset: 0; touch-action: none; }
  #viewer canvas { display: block; }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 28px 36px;
    pointer-events: none;
    z-index: 10;
  }
  header h1 {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  header p {
    margin-top: 4px;
    font-size: 13px;
    color: #86868b;
  }

  #hint {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #86868b;
    background: rgba(255,255,255,.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid rgba(0,0,0,.06);
    border-radius: 100px;
    padding: 9px 18px;
    white-space: nowrap;
    z-index: 10;
    transition: opacity .6s ease;
  }
  #hint.hidden { opacity: 0; }

  #loading {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 20;
    transition: opacity .5s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .label { font-size: 14px; color: #86868b; font-variant-numeric: tabular-nums; }
  #bar {
    width: 200px; height: 3px;
    background: #e8e8ed;
    border-radius: 3px;
    overflow: hidden;
  }
  #bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: #1d1d1f;
    border-radius: 3px;
    transition: width .2s ease;
  }
  @media (max-width: 600px) {
    header { padding: 20px 22px; }
    header h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<div id="viewer"></div>

<header>
  <h1>李帅b的鞋子</h1>
  <p>3D 模型在线预览</p>
</header>

<div id="hint">拖动旋转 · 滚轮缩放 · 双指平移</div>

<div id="loading">
  <div id="bar"><i></i></div>
  <div class="label">正在加载模型 <span id="pct">0%</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const container = document.getElementById('viewer');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 5000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

// 用户一上手就停止自动旋转，并淡出提示
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  document.getElementById('hint').classList.add('hidden');
}, { once: true });

// 柔和的三点布光
const hemi = new THREE.HemisphereLight(0xffffff, 0xdfe3e8, 1.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(1, 1.4, 1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-1.2, 0.4, -0.8);
scene.add(fill);

const loader = new STLLoader();
const pctEl = document.getElementById('pct');
const barEl = document.querySelector('#bar i');

loader.load('cu.stl',
  geometry => {
    geometry.center();
    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
      color: 0xb8bcc4,
      metalness: 0.15,
      roughness: 0.55
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    scene.add(mesh);

    // 依据包围盒自动取景
    geometry.computeBoundingBox();
    const box = geometry.boundingBox;
    const size = new THREE.Vector3();
    box.getSize(size);
    const radius = size.length() / 2;

    camera.position.set(radius * 1.6, radius * 0.9, radius * 1.6);
    camera.near = radius / 100;
    camera.far = radius * 20;
    camera.updateProjectionMatrix();
    controls.minDistance = radius * 0.4;
    controls.maxDistance = radius * 6;
    controls.target.set(0, 0, 0);
    controls.update();

    // 模型下方的接地阴影
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(radius * 10, radius * 10),
      new THREE.ShadowMaterial({ opacity: 0.08 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = box.min.y;
    ground.receiveShadow = true;
    scene.add(ground);

    key.position.set(radius, radius * 1.4, radius);
    key.shadow.camera.left = -radius * 2;
    key.shadow.camera.right = radius * 2;
    key.shadow.camera.top = radius * 2;
    key.shadow.camera.bottom = -radius * 2;
    key.shadow.camera.near = radius / 10;
    key.shadow.camera.far = radius * 6;

    document.getElementById('loading').classList.add('done');
  },
  xhr => {
    if (xhr.lengthComputable) {
      const p = Math.round(xhr.loaded / xhr.total * 100);
      pctEl.textContent = p + '%';
      barEl.style.width = p + '%';
    }
  },
  err => {
    document.querySelector('#loading .label').textContent = '模型加载失败，请刷新重试';
    console.error(err);
  }
);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>

</body>
</html>
